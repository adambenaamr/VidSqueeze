[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidsqueeze"
version = "1.0.0"
description = "Simple cross-platform video compression CLI using FFmpeg"
requires-python = ">=3.9"
dependencies = [
  "tqdm"
]

[project.scripts]
vs = "vidsqueeze.cli:run"
